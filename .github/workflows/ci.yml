name: CI Pipeline Integrado

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Instalar Dependencias y Herramientas
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -r backend/microservicio_fastapi/requirements.txt
        pip install -r backend/orquestador_django/requirements.txt

    - name: Análisis Estático de Código (Linting con Flake8)
      run: |
        # Verifica errores críticos de sintaxis en ambos backends
        flake8 backend/microservicio_fastapi --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend/orquestador_django --count --select=E9,F63,F7,F82 --show-source --statistics